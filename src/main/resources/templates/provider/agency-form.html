<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profilo Agenzia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="form-box">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"> Profilo Agenzia</h4>
        <a href="/provider/dashboard" class="btn btn-sm btn-outline-secondary">← Dashboard</a>
    </div>

    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

    <form th:action="@{/provider/agency}" th:object="${dto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Nome agenzia *</label>
            <input type="text" th:field="*{name}"
                   class="form-control"
                   placeholder="es. Como Boat Experience"
                   required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrizione</label>
            <textarea th:field="*{description}"
                      class="form-control" rows="3"
                      placeholder="Descrivi la tua agenzia..."></textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Zona operativa *</label>
                <select th:field="*{zone}" class="form-select" required>
                    <option value="">Seleziona zona</option>
                    <option value="Como">Como</option>
                    <option value="Bellagio">Bellagio</option>
                    <option value="Varenna">Varenna</option>
                    <option value="Lecco">Lecco</option>
                    <option value="Menaggio">Menaggio</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Telefono</label>
                <input type="text" th:field="*{phone}"
                       class="form-control"
                       placeholder="031 000000"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Sito web</label>
            <input type="text" th:field="*{website}"
                   class="form-control"
                   placeholder="www.tuaagenzia.it"/>
        </div>

        <div class="mb-3">
            <label class="form-label">URL immagine profilo</label>
            <input type="text" th:field="*{profileImageUrl}"
                   class="form-control"
                   placeholder="https://..."/>
            <div class="form-text">Incolla il link di un'immagine online</div>
        </div>

        <!-- popolata da agency-form-map.js -->
        <div class="mb-4">
            <label class="form-label fw-bold"> Posizione sulla mappa</label>
            <div id="mappaForm"></div>
            <div class="form-text mb-2">Clicca sulla mappa per posizionare la tua agenzia</div>
            <div class="row g-2">
                <div class="col-6">
                    <input type="number" th:field="*{latitude}"
                           id="latInput"
                           class="form-control form-control-sm"
                           placeholder="Latitudine"
                           step="0.000001"/>
                </div>
                <div class="col-6">
                    <input type="number" th:field="*{longitude}"
                           id="lngInput"
                           class="form-control form-control-sm"
                           placeholder="Longitudine"
                           step="0.000001"/>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <span th:text="${hasAgency} ? 'Aggiorna' : 'Crea agenzia'"></span>
            </button>
            <a href="/provider/dashboard" class="btn btn-outline-secondary">Annulla</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    // dati per agency-form-map.js, restano qui perché servono l'inline di Thymeleaf
    var latVal = /*[[${dto.latitude}]]*/ null;
    var lngVal = /*[[${dto.longitude}]]*/ null;
</script>
<script th:src="@{/js/agency-form-map.js}"></script>

</body>
</html>
