<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Tour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="form-box">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Aggiungi Tour</h4>
        <a href="/provider/dashboard" class="btn btn-sm btn-outline-secondary">← Dashboard</a>
    </div>

    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

    <form th:action="@{/provider/tours/new}" th:object="${dto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Nome del tour *</label>
            <input type="text" th:field="*{name}"
                   class="form-control"
                   placeholder="es. Giro panoramico del lago"
                   required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrizione</label>
            <textarea th:field="*{description}"
                      class="form-control" rows="3"
                      placeholder="Descrivi il tour..."></textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Prezzo (€) *</label>
                <input type="number" th:field="*{price}"
                       class="form-control"
                       step="0.01" min="0"
                       placeholder="es. 75.00"
                       required/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Durata (minuti) *</label>
                <input type="number" th:field="*{durationMinutes}"
                       class="form-control"
                       min="30"
                       placeholder="es. 120"
                       required/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Fascia oraria</label>
                <select th:field="*{timeSlot}" class="form-select">
                    <option value="">Seleziona</option>
                    <option value="Mattina">Mattina</option>
                    <option value="Pomeriggio">Pomeriggio</option>
                    <option value="Sera">Sera</option>
                    <option value="Tutto il giorno">Tutto il giorno</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Zona di partenza *</label>
            <select th:field="*{zoneDeparture}" class="form-select" required>
                <option value="">Seleziona zona</option>
                <option value="Como">Como</option>
                <option value="Bellagio">Bellagio</option>
                <option value="Varenna">Varenna</option>
                <option value="Lecco">Lecco</option>
                <option value="Menaggio">Menaggio</option>
            </select>
        </div>

        <!-- checkbox nascosti, il valore va nel campo hidden sotto via tour-form.js -->
        <div class="mb-4">
            <label class="form-label">Giorni disponibili</label>
            <div class="d-flex flex-wrap gap-2 mt-1">
                <div th:each="giorno : ${ {'LUN','MAR','MER','GIO','VEN','SAB','DOM'} }">
                    <input type="checkbox"
                           name="giorni"
                           th:value="${giorno}"
                           th:id="${giorno}"
                           class="d-none"/>
                    <label th:for="${giorno}" class="giorno-label"
                           th:text="${giorno}"></label>
                </div>
            </div>
            <input type="hidden" th:field="*{availableDays}" id="availableDaysInput"/>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salva tour</button>
            <a href="/provider/dashboard" class="btn btn-outline-secondary">Annulla</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/tour-form.js}"></script>

</body>
</html>
