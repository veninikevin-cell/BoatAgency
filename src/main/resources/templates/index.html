<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>BoatAgency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">BoatAgency</a>
        <div class="ms-auto d-flex gap-2">
            <span sec:authorize="isAnonymous()">
                <a href="/login" class="btn btn-outline-light btn-sm">Accedi</a>
                <a href="/register" class="btn btn-light btn-sm">Registrati</a>
            </span>
            <span sec:authorize="isAuthenticated()">
                <a href="/provider/dashboard"
                   sec:authorize="hasRole('PROVIDER')"
                   class="btn btn-light btn-sm me-1">Dashboard</a>
                <a href="/bookings/my"
                   sec:authorize="hasRole('USER')"
                   class="btn btn-light btn-sm me-1">Le mie prenotazioni</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-outline-light btn-sm" type="submit">Esci</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="hero-banner mb-4">
    <div class="container">
        <h1 class="fw-bold">Scopri il Lago di Como</h1>
        <p class="lead">Trova il tour in barca perfetto per te</p>
    </div>
</div>

<div class="container">

    <!-- filtri, 3 strategie combinate lato HomeController (zona/prezzo/nome) -->
    <div class="card mb-4 p-3">
        <form method="get" action="/" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Zona di partenza</label>
                <select name="zona" class="form-select">
                    <option value="Tutte">Tutte</option>
                    <option value="Como" th:selected="${zona == 'Como'}">Como</option>
                    <option value="Bellagio" th:selected="${zona == 'Bellagio'}">Bellagio</option>
                    <option value="Varenna" th:selected="${zona == 'Varenna'}">Varenna</option>
                    <option value="Lecco" th:selected="${zona == 'Lecco'}">Lecco</option>
                    <option value="Menaggio" th:selected="${zona == 'Menaggio'}">Menaggio</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Prezzo massimo (€)</label>
                <input type="number" name="maxPrezzo"
                       class="form-control"
                       th:value="${maxPrezzo}"
                       placeholder="es. 100"/>
            </div>
            <div class="col-md-3">
                <label class="form-label">Nome agenzia</label>
                <input type="text" name="nomeAgenzia"
                       class="form-control"
                       th:value="${nomeAgenzia}"
                       placeholder="es. Como Boat..."/>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Cerca</button>
            </div>
            <div class="col-md-2">
                <a href="/" class="btn btn-outline-secondary w-100">Reset</a>
            </div>
        </form>
    </div>

    <!-- marker popolati via fetch a /api/agenzie, vedi home-map.js -->
    <div class="card mb-4">
        <div class="card-header fw-bold"> Agenzie sul Lago di Como</div>
        <div class="card-body p-0">
            <div id="mappa"></div>
        </div>
    </div>

    <div th:if="${tours.empty}" class="alert alert-warning">
        Nessun tour trovato. Prova a cambiare i filtri.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="tour : ${tours}">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <a th:href="@{/public/agency/{id}(id=${tour.agency.id})}"
                       class="text-white text-decoration-none small"
                       th:text="${tour.agency.name}"></a>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${tour.name}"></h5>
                    <p class="card-text text-muted small"
                       th:text="${tour.description}"></p>
                    <div class="mt-2">
                        <span class="badge bg-secondary me-1"
                              th:text="${tour.zoneDeparture}"></span>
                        <span class="badge bg-info text-dark me-1"
                              th:text="${tour.getDurationFormatted()}"></span>
                        <span class="badge bg-success"
                              th:text="${tour.price} + ' €'"></span>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <a th:href="@{/bookings/new/{id}(id=${tour.id})}"
                       sec:authorize="hasRole('USER')"
                       class="btn btn-primary w-100">
                        Prenota ora
                    </a>
                    <a href="/login"
                       sec:authorize="isAnonymous()"
                       class="btn btn-outline-primary w-100">
                        Accedi per prenotare
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

<footer class="mt-5 py-3 text-center text-muted small">
    <p>BoatAgency &copy;</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/home-map.js}"></script>

</body>
</html>
