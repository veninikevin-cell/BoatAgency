<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accedi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-soft">

<div class="login-box">
    <h3 class="mb-1 fw-bold text-primary"> Bentornato</h3>
    <p class="text-muted mb-4">Accedi al tuo account</p>

    <div th:if="${param.error}" class="alert alert-danger py-2">
        Email o password non corretti.
    </div>

    <div th:if="${param.registered}" class="alert alert-success py-2">
        Registrazione completata! Ora puoi accedere.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username"
                   class="form-control"
                   placeholder="latua@email.com"
                   required/>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="••••••••"
                   required/>
        </div>

        <button type="submit" class="btn btn-primary w-100">Accedi</button>
    </form>

    <hr class="my-3"/>
    <p class="text-center text-muted small">
        Non hai un account?
        <a href="/register">Registrati</a>
    </p>
</div>

</body>
</html>
