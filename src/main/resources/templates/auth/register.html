<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrati</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-soft">

<div class="register-box">
    <h3 class="fw-bold text-primary mb-1">Crea un account</h3>
    <p class="text-muted mb-4 small">BoatAgency</p>

    <div th:if="${error}" class="alert alert-danger py-2 small"
         th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${dto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">Nome</label>
                <input type="text" th:field="*{firstName}"
                       class="form-control"
                       placeholder="Mario"
                       required/>
            </div>
            <div class="col-6">
                <label class="form-label">Cognome</label>
                <input type="text" th:field="*{lastName}"
                       class="form-control"
                       placeholder="Rossi"
                       required/>
            </div>
        </div>

        <div class="mt-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}"
                   class="form-control"
                   placeholder="mario@email.com"
                   required/>
        </div>

        <div class="mt-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}"
                   class="form-control"
                   placeholder="minimo 6 caratteri"
                   required/>
        </div>

        <div class="mt-3">
            <label class="form-label">Conferma password</label>
            <input type="password" th:field="*{confirmPassword}"
                   class="form-control"
                   placeholder="ripeti la password"
                   required/>
        </div>

        <!-- validazione lato server in UserService.register(), qui solo UI -->
        <div class="mt-4 mb-3">
            <label class="form-label fw-bold">Che tipo di account vuoi?</label>
            <div class="row g-2 mt-1">
                <div class="col-6">
                    <label class="tipo-card d-block">
                        <input type="radio" th:field="*{accountType}"
                               value="USER" class="me-2" checked/>
                        <strong> Utente</strong>
                        <p class="text-muted small mb-0 mt-1">
                            Cerca e prenota tour
                        </p>
                    </label>
                </div>
                <div class="col-6">
                    <label class="tipo-card d-block">
                        <input type="radio" th:field="*{accountType}"
                               value="PROVIDER" class="me-2"/>
                        <strong> Fornitore</strong>
                        <p class="text-muted small mb-0 mt-1">
                            Pubblica i tuoi tour
                        </p>
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">
            Registrati
        </button>
    </form>

    <hr class="my-3"/>
    <p class="text-center text-muted small">
        Hai già un account? <a href="/login">Accedi</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
