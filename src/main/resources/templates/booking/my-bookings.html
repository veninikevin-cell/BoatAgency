<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Le mie prenotazioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">BoatAgency</a>
        <div class="ms-auto">
            <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-outline-light btn-sm">Esci</button>
            </form>
        </div>
    </div>
</nav>

<div class="contenuto">
    <h4 class="fw-bold mb-1">Le mie prenotazioni</h4>
    <p class="text-muted small mb-4">Storico delle prenotazioni effettuate</p>

    <div th:if="${bookings.empty}" class="card p-4 text-center">
        <p class="text-muted mb-2">Non hai ancora prenotato nessun tour.</p>
        <a href="/" class="btn btn-primary btn-sm">Cerca tour</a>
    </div>

    <div th:if="${!bookings.empty}">
        <div class="card mb-3" th:each="b : ${bookings}">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="fw-bold mb-1" th:text="${b.tour.name}"></h6>
                        <p class="text-muted small mb-1"
                           th:text="${b.tour.agency.name}"></p>
                        <div class="d-flex gap-3 small text-muted">
                            <span>📅 <span th:text="${b.bookingDate}"></span></span>
                            <span>👥 <span th:text="${b.numPeople}"></span> persone</span>
                            <span>💶 <span th:text="${b.tour.price}"></span> €</span>
                        </div>
                        <p th:if="${b.notes != null and !b.notes.blank}"
                           class="small text-muted mt-1 mb-0">
                            📝 <span th:text="${b.notes}"></span>
                        </p>
                    </div>
                    <span class="badge"
                          th:classappend="'stato-' + ${b.status.name()}"
                          th:text="${b.status}"></span>
                </div>

                <div class="mt-3 d-flex gap-2">
                    <a th:href="@{/chat/{id}(id=${b.id})}"
                       class="btn btn-sm btn-outline-primary">
                        💬 Chat con il fornitore
                    </a>
                    <!-- annulla disponibile solo finché è PENDING, vedi BookingService.cancelBooking -->
                    <form th:if="${b.status.name() == 'PENDING'}"
                          th:action="@{/bookings/cancel/{id}(id=${b.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Annullare la prenotazione?')">
                            ✗ Annulla
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="notifica" class="notifica-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/booking-notifications.js}"></script>
</body>
</html>
