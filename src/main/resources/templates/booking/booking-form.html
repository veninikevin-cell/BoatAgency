<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prenota Tour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="form-box narrow">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"> Prenota il tour</h4>
        <a href="/" class="btn btn-sm btn-outline-secondary">← Torna</a>
    </div>

    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

    <form th:action="@{/bookings/new/{id}(id=${tourId})}"
          th:object="${dto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{tourId}"/>

        <!-- popolato/gestito interamente da booking-calendar.js -->
        <div class="mb-4">
            <label class="form-label fw-bold">Scegli la data</label>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cambioMese(-1)">‹</button>
                <span id="meseAnno" class="fw-bold"></span>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cambioMese(1)">›</button>
            </div>
            <div class="calendario-header mb-1">
                <span>Lu</span>
                <span>Ma</span>
                <span>Me</span>
                <span>Gi</span>
                <span>Ve</span>
                <span>Sa</span>
                <span>Do</span>
            </div>
            <div id="calendario" class="calendario-grid"></div>
            <input type="hidden" th:field="*{bookingDate}" id="dataScelta"/>
            <p class="text-muted small mt-2">
                Data selezionata: <span id="dataVisibile">nessuna</span>
            </p>
            <div class="d-flex gap-3 mt-2 small text-muted">
                <span><span style="color:#842029">■</span> Non disponibile</span>
                <span><span style="color:#0d6efd">■</span> Selezionato</span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Numero di persone *</label>
            <input type="number" th:field="*{numPeople}"
                   class="form-control"
                   min="1" max="20"
                   placeholder="es. 2"
                   required/>
        </div>

        <div class="mb-4">
            <label class="form-label">Note aggiuntive</label>
            <textarea th:field="*{notes}"
                      class="form-control" rows="2"
                      placeholder="Allergie, richieste speciali..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Conferma prenotazione
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // dati per booking-calendar.js, restano qui perché servono l'inline di Thymeleaf
    var dateOccupate = /*[[${dateOccupate}]]*/ [];
    var availableDays = /*[[${availableDays}]]*/ '';
</script>
<script th:src="@{/js/booking-calendar.js}"></script>

</body>
</html>
