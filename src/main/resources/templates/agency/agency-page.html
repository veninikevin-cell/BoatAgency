<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${agency.name}">Agenzia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">BoatAgency</a>
        <div class="ms-auto d-flex gap-2">
            <a href="/" class="btn btn-outline-light btn-sm">← Home</a>
            <span sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-outline-light btn-sm">Esci</button>
                </form>
            </span>
        </div>
    </div>
</nav>

<div class="hero-banner mb-4">
    <div class="container">
        <div class="d-flex align-items-center gap-4">
            <img th:if="${agency.profileImageUrl != null and !agency.profileImageUrl.blank}"
                 th:src="${agency.profileImageUrl}"
                 class="agency-logo"
                 alt="logo"/>
            <div>
                <h2 class="fw-bold mb-1" th:text="${agency.name}"></h2>
                <span class="badge bg-light text-dark me-2"
                      th:text="${agency.zone}"></span>
                <span th:if="${agency.phone != null}"
                      class="badge bg-light text-dark me-2"
                      th:text="${agency.phone}"></span>
                <div class="mt-2">
                    <span class="stelle">
                        <span th:each="i : ${#numbers.sequence(1, 5)}"
                              th:text="${i <= media} ? '★' : '☆'"></span>
                    </span>
                    <span class="ms-1 small"
                          th:text="${#numbers.formatDecimal(media, 1, 1)} + ' / 5 (' + ${reviews.size()} + ' recensioni)'"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row g-4">

        <div class="col-md-7">

            <div class="card mb-4">
                <div class="card-header fw-bold">Descrizione</div>
                <div class="card-body">
                    <p th:text="${agency.description}" class="mb-1"></p>
                    <a th:if="${agency.website != null and !agency.website.blank}" th:href="${agency.website}"
                       target="_blank" class="btn btn-sm btn-outline-primary mt-2">
                        Visita il sito
                    </a>
                </div>
            </div>

            <!-- popolata da agency-page-map.js, solo se ci sono coordinate -->
            <div th:if="${agency.latitude != null and agency.longitude != null}"
                 class="card mb-4">
                <div class="card-header fw-bold">Dove siamo</div>
                <div class="card-body p-0">
                    <div id="mappaAgenzia"></div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header fw-bold">Tour disponibili</div>
                <div class="card-body">
                    <div th:if="${tours.empty}" class="text-muted">
                        Nessun tour pubblicato.
                    </div>
                    <div th:each="tour : ${tours}" class="tour-badge">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1 fw-bold" th:text="${tour.name}"></h6>
                                <p class="text-muted small mb-1"
                                   th:text="${tour.description}"></p>
                                <span class="badge bg-secondary me-1"
                                      th:text="${tour.zoneDeparture}"></span>
                                <span class="badge bg-info text-dark me-1"
                                      th:text="${tour.getDurationFormatted()}"></span>
                                <span class="badge bg-success"
                                      th:text="${tour.price} + ' €'"></span>
                            </div>
                            <a th:href="@{/bookings/new/{id}(id=${tour.id})}"
                               sec:authorize="hasRole('USER')"
                               class="btn btn-sm btn-primary ms-2">
                                Prenota
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">

            <!-- visibile solo se canReview, calcolato in PublicController -->
            <div th:if="${canReview}" class="card mb-4 border-primary">
                <div class="card-header bg-primary text-white fw-bold">
                    Lascia una recensione
                </div>
                <div class="card-body">
                    <div th:if="${error}"
                         class="alert alert-danger small py-2"
                         th:text="${error}"></div>

                    <form th:action="@{/public/agency/{id}/review(id=${agency.id})}"
                          th:object="${dto}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label">Voto</label>
                            <div class="d-flex gap-2 flex-wrap">
                                <div th:each="n : ${#numbers.sequence(1, 5)}"
                                     class="form-check form-check-inline">
                                    <input type="radio"
                                           th:field="*{rating}"
                                           th:value="${n}"
                                           th:id="'star' + ${n}"
                                           class="form-check-input"/>
                                    <label th:for="'star' + ${n}"
                                           th:text="${n} + ' ★'"
                                           class="form-check-label btn btn-sm btn-outline-warning">
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Commento</label>
                            <textarea th:field="*{comment}"
                                      class="form-control" rows="3"
                                      placeholder="Racconta la tua esperienza..."
                                      required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Pubblica recensione
                        </button>
                    </form>
                </div>
            </div>

            <div th:if="${!canReview}" class="alert alert-info small mb-4">
                <span sec:authorize="isAnonymous()">
                    <a href="/login">Accedi</a> per lasciare una recensione.
                </span>
                <span sec:authorize="isAuthenticated()">
                    Puoi recensire un'agenzia solo dopo aver completato un tour con essa.
                </span>
            </div>

            <div class="card">
                <div class="card-header fw-bold">
                     Recensioni (<span th:text="${reviews.size()}"></span>)
                </div>
                <div class="card-body p-0">
                    <div th:if="${reviews.empty}"
                         class="p-3 text-muted text-center">
                        Nessuna recensione ancora.
                    </div>
                    <div th:each="r : ${reviews}"
                         class="recensione-card card m-2 p-3">
                        <div class="d-flex justify-content-between mb-1">
                            <strong th:text="${r.user.firstName} + ' ' + ${r.user.lastName}"></strong>
                            <span class="stelle small">
                                <span th:each="i : ${#numbers.sequence(1, 5)}"
                                      th:text="${i <= r.rating} ? '★' : '☆'"></span>
                            </span>
                        </div>
                        <p class="mb-1 small" th:text="${r.comment}"></p>
                        <small class="text-muted"
                               th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy')}"></small>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    // dati per agency-page-map.js, restano qui perché servono l'inline di Thymeleaf
    var lat = /*[[${agency.latitude}]]*/ null;
    var lng = /*[[${agency.longitude}]]*/ null;
    var agencyName = /*[[${agency.name}]]*/ '';
</script>
<script th:src="@{/js/agency-page-map.js}"></script>

</body>
</html>
