<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="chat-box">

    <div class="chat-header d-flex justify-content-between align-items-center">
        <div>
            <h6 class="mb-0 fw-bold">💬 Chat</h6>
            <small>Prenotazione #<span th:text="${bookingId}"></span></small>
        </div>
        <a href="javascript:history.back()"
           class="btn btn-sm btn-outline-light"> Indietro</a>
    </div>

    <div class="chat-messages" id="chatMessages">

        <div th:if="${messaggi.empty}" class="text-center text-muted py-5">
            <p>Chat vuota</p>
            <small>Inizia la conversazione</small>
        </div>

        <div th:each="msg : ${messaggi}">
            <div th:if="${msg.sender.email == currentUser.email}"
                 class="msg-mio">
                <div>
                    <div class="bolla">
                        <span th:text="${msg.content}"></span>
                        <div class="ora-msg text-end"
                             th:text="${#temporals.format(msg.sentAt, 'HH:mm')}"></div>
                    </div>
                </div>
            </div>
            <div th:if="${msg.sender.email != currentUser.email}"
                 class="msg-altro">
                <div>
                    <div class="nome-mittente"
                         th:text="${msg.sender.firstName}"></div>
                    <div class="bolla">
                        <span th:text="${msg.content}"></span>
                        <div class="ora-msg"
                             th:text="${#temporals.format(msg.sentAt, 'HH:mm')}"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="chat-input">
        <div class="d-flex gap-2">
            <input type="text" id="inputMsg"
                   class="form-control"
                   placeholder="Scrivi un messaggio..."
                   onkeydown="if(event.key==='Enter') inviaMessaggio()"/>
            <button class="btn btn-primary px-4"
                    onclick="inviaMessaggio()">Invia</button>
        </div>
    </div>
</div>


<input type="hidden" id="bookingId" th:value="${bookingId}"/>
<input type="hidden" id="currentUserEmail" th:value="${currentUser.email}"/>
<input type="hidden" id="currentUserName" th:value="${currentUser.firstName}"/>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    var bookingId = document.getElementById('bookingId').value;
    var myEmail = document.getElementById('currentUserEmail').value;
    var myName = document.getElementById('currentUserName').value;
    var receiverEmail = /*[[${receiverEmail}]]*/ '';
</script>
<script th:src="@{/js/chat.js}"></script>

</body>
</html>
